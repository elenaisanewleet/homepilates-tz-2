<style>
#hp-site {
  --ink: #263832;
  --soft: #53635a;
  --paper: #f9f8f1;
  --tint: #eff0e8;
  --line: #cbd1c4;
  --blue: #3769a8;
  --olive: #c6cd4b;
  --pad: clamp(20px, 4.5vw, 80px);
  color: var(--ink);
  background: var(--paper);
  font: 400 17px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif;
  overflow-wrap: break-word;
  & *, & *::before, & *::after { box-sizing: border-box; }
  & :is(h1,h2,p,figure,ul) { margin: 0; }
  & a { color: inherit; text-decoration: none; }
  & :is(a,summary):focus-visible { outline: 3px solid #254c79; outline-offset: 4px; }
  & [id] { scroll-margin-top: 105px; }
  & .wrap { width: min(calc(100% - var(--pad) * 2), 1400px); margin-inline: auto; }
  & .header { position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 1px solid var(--line); }
  & .headbar, & .head-actions, & .quick, & .actions, & .wordmark, & .eyebrow, & .btn, & .textlink { display: flex; align-items: center; }
  & .headbar { min-height: 78px; gap: 28px; justify-content: space-between; }
  & .wordmark { width: fit-content; min-height: 44px; }
  & .wordmark svg, & .giftmark svg { display: block; width: 94px; height: auto; }
  & .quick { gap: clamp(18px, 2.6vw, 48px); font-size: 15px; }
  & :is(.quick, nav) a { display: inline-flex; align-items: center; min-height: 44px; }
  & nav a:is(:hover,[aria-current="page"]), & .textlink:hover { text-decoration: underline; text-underline-offset: 5px; }
  & .head-actions { gap: 14px; }
  & .btn { display: inline-flex; width: fit-content; justify-content: center; gap: 20px; min-height: 48px; padding: 12px 20px; border: 1px solid var(--blue); border-radius: 6px; background: var(--blue); color: #fff; font-weight: 550; font-size: 15px; line-height: 1.3; transition: background-color .22s, border-color .22s; }
  & .btn:hover { background: #28568f; border-color: #28568f; }
  & .secondary { background: transparent; color: var(--ink); border-color: #83958b; }
  & .secondary:hover { background: #e5e9dd; border-color: var(--soft); }
  & .head-actions .btn { min-height: 44px; padding: 9px 16px; }
  & .arrow { font-family: Arial,sans-serif; font-weight: 400; font-size: 1.17em; line-height: 1; }
  & .menu { position: relative; }
  & summary { cursor: pointer; list-style: none; }
  & summary::-webkit-details-marker { display: none; }
  & .menu summary { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; min-width: 44px; padding: 5px 9px; font-size: 14px; }
  & .menu-lines { width: 19px; height: 9px; border-block: 1.7px solid currentColor; }
  & .menu nav { position: absolute; right: 0; top: calc(100% + 8px); width: min(292px,calc(100vw - 32px)); max-height: calc(100dvh - 90px); overflow: auto; padding: 12px 20px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 20px #24372e12; }
  & .menu nav a { display: flex; border-bottom: 1px solid var(--line); }
  & .menu nav a:last-child { border: 0; }
  & .skip { position: absolute; z-index: 20; left: 12px; top: 6px; transform: translateY(-180%); padding: 9px; background: white; }
  & .skip:focus { transform: none; }
  & .eyebrow, & .idx, & .serial, & .plate-top, & figcaption>span:last-child, & .gift small {
    font: 550 11px/1.4 "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: .09em; text-transform: uppercase;
  }
  & .eyebrow { gap: 11px; color: var(--soft); }
  & .index { display: inline-grid; min-width: 28px; height: 23px; place-items: center; border: 1px solid #9ba89a; border-radius: 20px; font-size: 10px; }
  & .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--olive); box-shadow: inset 0 0 0 1px #89943e55; }
  & .slash { color: #728176; }
  & h1, & h2, & .big { letter-spacing: -.055em; font-weight: 400; text-wrap: balance; }
  & h1 { font-size: clamp(47px,6.15vw,92px); line-height: .99; }
  & h2 { font-size: clamp(35px,4vw,63px); line-height: 1.04; }
  & .hero { display: grid; grid-template-columns: 1fr 1.07fr; align-items: center; gap: clamp(32px,4.1vw,76px); padding-block: clamp(48px,5vw,80px); }
  & .hero .eyebrow { margin-bottom: clamp(20px,2.7vw,44px); }
  & .hero h1 { max-width: 10.7em; }
  & .tagline { display: block; font-size: .45em; letter-spacing: -.045em; line-height: 1.12; color: var(--blue); margin-top: .44em; }
  & .lede { font-size: clamp(17px,1.4vw,21px); color: var(--soft); max-width: 43em; line-height: 1.5; }
  & .hero .lede { max-width: 29em; margin-top: 24px; }
  & .actions { flex-wrap: wrap; gap: 12px 22px; margin-top: 26px; }
  & .textlink { display: inline-flex; gap: 11px; min-height: 44px; color: #2c5486; font-weight: 550; font-size: 15px; }
  & .plate { position: relative; isolation: isolate; background: #e3e7d9; border: 1px solid #bac4b2; border-radius: 4px; overflow: hidden; }
  & .plate svg { display: block; width: 100%; height: auto; }
  & .plate-top { position: absolute; inset: 0 0 auto; display: flex; justify-content: space-between; padding: clamp(14px,2vw,28px); color: #40564b; }
  & figcaption { display: flex; padding: 14px clamp(14px,2vw,28px); justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid #bac4b2; background: #e2e7d8; }
  & figcaption b { display: block; font-size: 22px; font-weight: 500; letter-spacing: -.04em; }
  & figcaption small { color: #4c5c50; font-size: 12px; }
  & .facts { border-block: 1px solid var(--line); }
  & .factgrid { display: grid; grid-template-columns: 1fr 1.3fr 1fr; padding-block: 22px; }
  & .factgrid>div { display: grid; align-content: center; justify-content: center; border-left: 1px solid var(--line); padding-inline: 12px; }
  & .factgrid>div:first-child { border: none; justify-content: start; padding-left: 0; }
  & .factgrid small, & .directory-row small, & .note, & .trial span { color: var(--soft); }
  & .factgrid small { font-size: 13px; margin-bottom: 2px; }
  & .factgrid strong { font-size: clamp(19px,2vw,29px); font-weight: 450; letter-spacing: -.04em; }
  & .section { padding-block: clamp(58px,7vw,106px); }
  & .tint { background: var(--tint); }
  & .split { display: grid; grid-template-columns: .85fr 1.15fr; gap: 7%; }
  & :is(.section,.join,.side-card) .eyebrow { margin-bottom: 19px; }
  & :is(.split,.side-card,.status-card,.join) h2 + p, & .copy>p+p { margin-top: 18px; }
  & .copy>p:not(.big), & .side-card p, & .split h2+p { color: var(--soft); }
  & .copy .textlink { margin-top: 12px; }
  & .big { font-size: clamp(25px,2.5vw,40px); line-height: 1.17; }
  & .dir-link, & .trial { display: flex; align-items: baseline; gap: 16px; padding: 18px 2px; border-top: 1px solid var(--line); }
  & .dir-link small { font: 12px monospace; color: var(--soft); }
  & .dir-link span:not(.arrow), & .trial b { font-size: clamp(19px,1.7vw,28px); font-weight: 450; letter-spacing: -.035em; }
  & .dir-link .arrow, & .trial .arrow { margin-left: auto; align-self: center; }
  & .dir-link:hover, & .trial:hover { color: var(--blue); }
  & .trial span:first-child { flex: 1; }
  & .note { font-size: 14px; margin-block: 14px; }
  & .join { background: #e6e9bc; padding-block: clamp(46px,5.5vw,78px); }
  & .join-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  & .page-intro { padding-block: clamp(48px,6.5vw,100px) clamp(32px,4vw,60px); }
  & .page-intro h1 { margin: 21px 0; }
  & .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: clamp(56px,7vw,108px); }
  & .side-card, & .status-card, & .gift { border: 1px solid var(--line); background: var(--tint); border-radius: 6px; padding: clamp(24px,4vw,56px); }
  & :is(.side-card,.status-card) h2 { font-size: clamp(30px,3vw,47px); }
  & .status-card { background: #e6ecee; }
  & .status-card .eyebrow { margin-bottom: 30px; }
  & .status-card .btn, & .side-card>.btn, & .side-card>.textlink { margin-top: 20px; }
  & .list-section { padding-bottom: clamp(54px,7vw,106px); }
  & .directory-row { display: grid; grid-template-columns: .14fr 1fr auto; gap: 18px; align-items: baseline; border-top: 1px solid var(--line); padding: clamp(24px,3vw,48px) 0; }
  & .directory-row p { max-width: 43em; margin-top: 12px; color: var(--soft); }
  & .directory-row h2 { font-size: clamp(26px,3vw,44px); margin-top: 8px; }
  & .serial { color: var(--blue); }
  & .notice { background: #ebedcf; padding: 16px 20px; border-left: 3px solid #88913a; margin-bottom: 24px; max-width: 76em; font-size: 15px; }
  & .acc { border-top: 1px solid var(--line); }
  & .acc:last-of-type { border-bottom: 1px solid var(--line); }
  & .acc summary { display: grid; grid-template-columns: 38px 1fr 24px; gap: 12px; align-items: center; padding: 24px 3px; font-size: clamp(19px,2.05vw,32px); line-height: 1.2; letter-spacing: -.035em; }
  & .acc summary:hover { color: var(--blue); }
  & .idx { color: var(--soft); }
  & .plus { position: relative; width: 18px; height: 18px; }
  & .plus::before, & .plus::after { content: ""; position: absolute; background: currentColor; inset: 8px 0 auto; height: 1.5px; }
  & .plus::after { transform: rotate(90deg); }
  & details[open]>summary .plus::after { display: none; }
  & .prices { list-style: none; margin: 0 0 24px 52px; padding: 0 20px; background: var(--tint); border-radius: 4px; }
  & .prices li { display: flex; justify-content: space-between; gap: 18px; align-items: baseline; border-bottom: 1px solid var(--line); padding: 16px 0; }
  & .prices li:last-child { border: none; }
  & .prices strong, & .prices b { font-weight: 550; }
  & .prices b { white-space: nowrap; }
  & .prices small, & .prices p { display: block; margin-top: 4px; color: var(--soft); font-size: 14px; }
  & .answer { max-width: 54em; padding: 0 0 24px 53px; color: var(--soft); }
  & .people { list-style: none; padding: 0; }
  & .people li { display: flex; align-items: center; gap: clamp(15px,3vw,45px); padding: 18px 0; border-top: 1px solid var(--line); }
  & .people strong { font-weight: 400; font-size: clamp(23px,3vw,44px); letter-spacing: -.045em; }
  & .people .idx { margin-left: auto; }
  & .initials { display: grid; place-items: center; width: 52px; height: 52px; flex-shrink: 0; background: #e3e7d4; color: #435340; border-radius: 50%; font-size: 14px; }
  & .gift { background: #2e5888; color: #fff; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; }
  & .gift p { font-size: clamp(33px,4.3vw,68px); line-height: 1.02; letter-spacing: -.06em; margin-block: 45px; }
  & .giftmark, & footer .wordmark { padding: 7px 12px; border-radius: 4px; background: var(--paper); }
  & .address { background: #e5e9d4; }
  & .channels { display: grid; margin-top: 20px; }
  & .channels a { display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding-block: 8px; border-top: 1px solid var(--line); font-size: 15px; }
  & footer { background: #263c35; color: #f5f4e8; }
  & .footgrid { padding-block: clamp(44px,5vw,72px); display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,.8fr) minmax(0,1.1fr); gap: 40px clamp(32px,5vw,80px); }
  & .foot-title { display: block; margin-bottom: 18px; font: 550 11px/1.4 "SFMono-Regular", Consolas, monospace; letter-spacing: .09em; text-transform: uppercase; color: #a9bcac; }
  & .foot-studio p { margin-top: 22px; max-width: 40ch; font-size: 15px; line-height: 1.55; color: #ccdacd; }
  & .foot-studio .social { margin-top: 22px; }
  & .foot-links { display: grid; gap: 2px; font-size: 15px; }
  & .foot-links a { width: fit-content; min-height: 32px; }
  & footer a:hover { text-decoration: underline; text-underline-offset: 4px; }
  @media(max-width: 1023px) {
    & .quick { display: none; }
    & .hero { gap: 24px; grid-template-columns: 1fr 1fr; }
  }
  @media(max-width: 767px) {
    font-size: 16px;
    & .headbar { min-height: 64px; gap: 8px; }
    & .head-actions { gap: 4px; }
    & .menu-word { display: none; }
    & .headbar .wordmark svg { width: 78px; }
    & .head-actions .btn { font-size: 14px; padding-inline: 12px; gap: 8px; }
    & .hero, & .split, & .panels { grid-template-columns: 1fr; }
    & .hero { padding-block: 36px 28px; gap: 28px; }
    & .hero h1 { font-size: clamp(46px,10.8vw,72px); }
    & .hero .eyebrow { margin-bottom: 20px; }
    & .hero .lede { margin-top: 16px; }
    & .actions { margin-top: 20px; gap: 8px 16px; }
    & .factgrid { grid-template-columns: 1fr 1.35fr 1fr; padding-block: 16px; }
    & .factgrid>div { padding-inline: 8px; align-content: start; }
    & .factgrid small { font-size: 11px; line-height: 1.25; margin-bottom: 6px; }
    & .factgrid strong { font-size: 16px; line-height: 1.2; }
    & .split { gap: 24px; }
    & .join-inner { flex-direction: column; align-items: flex-start; }
    & .directory-row { grid-template-columns: 25px 1fr; gap: 8px; }
    & .directory-row>.textlink { grid-column: 2; }
    & .acc summary { grid-template-columns: 23px 1fr 18px; padding-block: 19px; }
    & .prices { margin-left: 0; padding-inline: 13px; }
    & .prices li { gap: 8px; }
    & .answer { padding-left: 0; }
  }
  @media(prefers-reduced-motion: reduce) { & * { transition: none !important; scroll-behavior: auto !important; } }
}
/* ---- ТЗ: content blocks, integrations and legal elements in the same visual system ---- */
#hp-site {
  & .cab-link { font-size: 14px; min-height: 44px; display: inline-flex; align-items: center; color: var(--soft); }
  & .cab-link:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 5px; }
  & .quick { font-size: 14px; gap: clamp(14px,1.6vw,28px); }
  & .trial-note { margin-top: 14px; color: var(--ink); font-size: clamp(16px,1.2vw,19px); }
  & .dir-link.static { cursor: default; }
  & .dir-link.static:hover { color: inherit; }
  & .steps { list-style: none; padding: 0; margin: 0; }
  & .steps li { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 18px 0; border-top: 1px solid var(--line); color: var(--soft); }
  & .steps li:last-child { border-bottom: 1px solid var(--line); }
  & .steps .serial { font: 550 12px/1.6 "SFMono-Regular", Consolas, monospace; }
  & .quote-band { background: #263c35; color: #f5f4e8; padding-block: clamp(56px,7vw,104px); }
  & .quote-band blockquote { margin: 0; font-size: clamp(26px,3.1vw,48px); line-height: 1.14; letter-spacing: -.045em; max-width: 30em; text-wrap: balance; }
  & .quote-band cite { display: block; margin-top: 28px; font: 550 11px/1.4 "SFMono-Regular", Consolas, monospace; letter-spacing: .09em; text-transform: uppercase; font-style: normal; color: var(--olive); }
  & .reviews { width: 100%; height: 560px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  & .tiles { display: grid; grid-template-columns: repeat(4,1fr); gap: 0; padding-block: clamp(40px,5vw,72px); }
  & .tile { display: flex; align-items: baseline; gap: 14px; padding: 20px 4px; border-top: 1px solid var(--line); font-size: clamp(17px,1.4vw,22px); letter-spacing: -.03em; }
  & .tile small { font: 12px monospace; color: var(--soft); }
  & .tile .arrow { margin-left: auto; padding-right: 16px; }
  & .tile:hover { color: var(--blue); }
  & .join-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 6%; align-items: start; }
  & .join-grid h2 + p { margin-top: 18px; color: #3d4f45; }
  & .join-widget { background: var(--paper); border-radius: 6px; padding: 12px; }
  & .mobi iframe { display: block; width: 100%; min-height: 320px; border: 0; }
  & .widget-section { margin-bottom: 28px; }
  & .widget-card { padding: 12px; }
  & .panels.single { grid-template-columns: 1fr; }
  & .panels > * { min-width: 0; }
  & .list-title { font-size: clamp(28px,2.6vw,40px); margin-bottom: 18px; }
  & .directory-row.is-pending h2, & .missing { color: var(--blue); }
  & .pending { color: var(--blue); }
  & .missing { margin-left: 6px; font-size: .85em; }
  & .person { display: grid; grid-template-columns: minmax(180px,.42fr) 1fr; gap: clamp(20px,4vw,64px); padding: clamp(28px,3.5vw,52px) 0; border-top: 1px solid var(--line); align-items: start; }
  & .portrait { width: 100%; aspect-ratio: 4/5; object-fit: cover; object-position: center 25%; border-radius: 4px; display: block; }
  & .portrait-pending { display: grid; place-content: center; justify-items: center; gap: 10px; background: var(--tint); border: 1px dashed #9ba89a; color: var(--soft); }
  & .portrait-pending .initials { width: 72px; height: 72px; font-size: 18px; }
  & .person h2 { font-size: clamp(30px,3.4vw,52px); margin-top: 10px; }
  & .person-lead h2 { font-size: clamp(38px,4.6vw,72px); }
  & .role { margin-top: 10px; font: 550 11px/1.4 "SFMono-Regular", Consolas, monospace; letter-spacing: .09em; text-transform: uppercase; color: var(--blue); }
  & .bio { margin-top: 18px; color: var(--soft); max-width: 46em; }
  & .bio p + p { margin-top: 12px; }
  & .plain { list-style: none; padding: 0; margin: 14px 0; }
  & .plain li { padding: 8px 0; border-top: 1px solid var(--line); }
  & .side-card .steps { margin-top: 18px; }
  & .side-card p + p { margin-top: 12px; }
  & .cap { margin-top: 22px; font: 550 11px/1.4 "SFMono-Regular", Consolas, monospace; letter-spacing: .09em; text-transform: uppercase; color: var(--soft); }
  & .channels a, & .channel-static { display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding-block: 10px; border-top: 1px solid var(--line); font-size: 16px; }
  & .channels small { display: block; font-size: 12px; color: var(--soft); }
  & .channels a:hover { color: var(--blue); }
  & .side-card .social { margin-top: 10px; }
  & .insta { margin-top: 16px; }
  & .insta a, & .bio a { text-decoration: underline; text-underline-offset: 4px; overflow-wrap: anywhere; }
  & .map { width: 100%; min-height: 420px; align-self: stretch; border: 1px solid var(--line); border-radius: 6px; background: var(--tint); }
  & .feedback { display: grid; gap: 18px; margin-top: 18px; }
  & .field { display: grid; gap: 6px; font-size: 13px; color: var(--soft); }
  & .field input, & .field textarea { font: inherit; font-size: 17px; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid #83958b; padding: 8px 0; border-radius: 0; resize: vertical; }
  & .field :is(input,textarea):focus { outline: none; border-bottom-color: var(--blue); }
  & .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--soft); }
  & .check input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--blue); flex: none; }
  & .check a { text-decoration: underline; text-underline-offset: 3px; }
  & .form-note { font-size: 13px; color: var(--soft); border-left: 3px solid var(--olive); padding-left: 12px; }
  & .feedback .btn { border: 0; cursor: pointer; font-family: inherit; }
  & .linklike { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
  & .cookie-box { position: fixed; z-index: 30; left: 12px; right: 12px; bottom: 12px; margin-left: auto; max-width: 520px; max-height: 60dvh; overflow: auto; padding: 18px; background: var(--paper); border: 1px solid #9ba89a; border-radius: 6px; box-shadow: 0 10px 30px #24372e26; font-size: 14px; }
  & .cookie-box details { margin-top: 8px; }
  & .cookie-box summary { padding: 8px 0; text-decoration: underline; text-underline-offset: 3px; }
  & .cookie-opts { display: grid; gap: 10px; padding-bottom: 8px; }
  & .cookie-opts .check { font-size: 12.5px; }
  & .cookie-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; }
  & .cookie-foot .btn { border: 0; cursor: pointer; font-family: inherit; min-height: 42px; }
  & .foot-contacts dl { display: grid; grid-template-columns: 96px 1fr; gap: 12px 16px; margin: 0; align-items: baseline; }
  & .foot-contacts dt { font: 550 11px/1.4 "SFMono-Regular", Consolas, monospace; letter-spacing: .09em; text-transform: uppercase; color: #a9bcac; }
  & .foot-contacts dd { margin: 0; font-size: 16px; }
  & .fc-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
  & .fc-btn { display: inline-flex; align-items: center; gap: 12px; height: 44px; padding: 0 16px; border: 1px solid #677a6a; border-radius: 6px; font-size: 14px; }
  & .fc-btn:hover { border-color: #f5f4e8; text-decoration: none; }
  & .social { display: flex; gap: 8px; }
  & .social a { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; }
  & .social svg { width: 22px; height: 22px; fill: currentColor; }
  & footer .social a { border-color: #677a6a; }
  & footer .social a:hover { border-color: #f5f4e8; }
